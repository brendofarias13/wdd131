<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmação da Avaliação do Produto">
    <meta name="author" content="Brendo Farias">
    <title>Avaliação Enviada</title>

    <link rel="stylesheet" href="estilos/formulario.css">
</head>

<body>

<header>
    <h1>Avaliação Enviada com Sucesso!</h1>
</header>

<main>

<section class="confirmacao">

    <h2>Obrigado pela sua avaliação!</h2>

    <p>
        Sua avaliação foi registrada com sucesso.
    </p>

    <p>
        Número de avaliações concluídas neste navegador:
    </p>

    <h3 id="contador">0</h3>

    <p>
        <a href="formulario.html">Enviar outra avaliação</a>
    </p>

</section>

</main>

<footer>

<p>
&copy;
<span id="currentyear"></span>
🌿 Brendo Farias 🌿 Brasil
</p>

<p id="lastModified"></p>

</footer>

<script>
const KEY = "reviewCount";

let count = Number(localStorage.getItem(KEY)) || 0;
count++;

localStorage.setItem(KEY, count);

document.getElementById("contador").textContent = count;

document.getElementById("currentyear").textContent =
new Date().getFullYear();

document.getElementById("lastModified").textContent =
`Última modificação: ${document.lastModified}`;
</script>

</body>
</html>
